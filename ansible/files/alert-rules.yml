groups:
  - name: infrastructure
    rules:
      - alert: InstanceDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Le serveur de production est indisponible"

      - alert: HighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU supérieur à 80 % pendant 10 minutes"

      - alert: LowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mémoire disponible inférieure à 15 %"

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Espace disque disponible inférieur à 15 %"

  - name: services
    rules:
      - alert: ObservabilityComponentDown
        expr: up{job="observability-stack"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Un composant de l'observabilité est indisponible"

      - alert: NginxExporterDown
        expr: up{job="nginx-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Les métriques Nginx ne sont plus disponibles"

      - alert: BackendDown
        expr: up{job="todo-backend"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Le backend Todo ou son endpoint Actuator est indisponible"

      - alert: ContainerDown
        expr: time() - container_last_seen{name!=""} > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Conteneur Docker absent depuis plus de 2 minutes"

      - alert: PublicUrlDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Une URL publique ne répond pas HTTP 2xx"
